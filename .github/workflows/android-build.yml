name: Android Build

# Compila la app Android en la nube: no hace falta JDK ni Android SDK local.
#
# Android va en modo remoto (ver capacitor.config.ts): el APK es un shell que
# abre el Next desplegado en Cloud Run. Por eso este workflow NO corre
# `next build` — no hay assets web que empaquetar, solo el proyecto nativo. Un
# cambio de UI sale con un deploy normal de la web, sin recompilar la app.
#
# Dos salidas:
#   - debug: APK instalable por sideload, para probar en un teléfono propio.
#   - release: AAB firmado, que es lo que sube a Play Console. Con `subir`
#     además lo deja en la pista elegida, sin pasar por la consola.
#
# El release necesita el keystore en secrets. Sin ellos el job de release se
# saltea y el de debug igual produce un APK.

on:
  workflow_dispatch:
    inputs:
      tipo:
        description: "Qué construir"
        required: true
        type: choice
        default: debug
        options:
          - debug
          - release
      version:
        description: "Versión visible (semver, ej. 1.0.0). Obligatoria en release; el versionCode sale del número de corrida"
        required: false
        default: ""
      subir:
        description: "Subir el AAB a Google Play (solo release)"
        type: boolean
        default: false
      pista:
        description: "Pista de Play a la que va el AAB"
        type: choice
        default: internal
        options:
          - internal
          - alpha
          - production
      novedades:
        description: "Novedades de la versión (opcional, va en la ficha de Play)"
        required: false
        default: ""
      serverUrl:
        description: "URL que abre la app (vacío = la de capacitor.config.ts)"
        required: false
        default: ""
  push:
    branches:
      - feature/mobile-apps

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

# id-token: para que google-github-actions/auth pueda impersonar al service
# account de Play por Workload Identity. No hay clave JSON en ningún lado.
permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: APK/AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar la versión
        # Play muestra el versionName tal cual; un valor vacío o con formato
        # raro se descubre recién en la consola. Mejor frenar acá.
        if: inputs.tipo == 'release'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::En release, 'version' tiene que ser semver (ej. 1.0.0). Recibí: '$VERSION'"
            exit 1
          fi

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Dependencias
        # --frozen-lockfile: el build tiene que fallar si el lockfile quedó
        # desincronizado, no resolver versiones distintas a las probadas.
        run: pnpm install --frozen-lockfile

      - name: Sync del proyecto nativo
        # Copia capacitor.config.ts al proyecto Android. Es lo que baja el
        # server.url al APK; sin esto el shell no sabe qué abrir.
        env:
          CAP_SERVER_URL: ${{ inputs.serverUrl }}
        run: |
          if [ -n "${CAP_SERVER_URL:-}" ]; then
            echo "Apuntando la app a $CAP_SERVER_URL"
          fi
          npx cap sync android

      - name: Verificar que el APK sepa a dónde apuntar
        # Un shell remoto sin server.url compila igual y se instala igual: la
        # falla aparece recién al abrirlo, con una pantalla en blanco.
        run: |
          CONFIG=android/app/src/main/assets/capacitor.config.json
          URL=$(node -p "require('./$CONFIG').server?.url ?? ''")
          if [ -z "$URL" ]; then
            echo "::error::El config del APK no tiene server.url. En modo remoto eso es una app que abre un WebView vacío."
            exit 1
          fi
          echo "La app abrirá: $URL"

      - name: Build debug
        if: inputs.tipo != 'release'
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      - name: Preparar keystore de release
        if: inputs.tipo == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secret ANDROID_KEYSTORE_BASE64 (ver PUBLICACION.md § keystore)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Build release (AAB firmado)
        if: inputs.tipo == 'release'
        env:
          ONTIMEAI_KEYSTORE_FILE: release.keystore
          ONTIMEAI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ONTIMEAI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ONTIMEAI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ONTIMEAI_VERSION_NAME: ${{ inputs.version }}
          ONTIMEAI_VERSION_CODE: ${{ github.run_number }}
        run: |
          ./gradlew bundleRelease --no-daemon
          echo "Versión ${ONTIMEAI_VERSION_NAME} (${ONTIMEAI_VERSION_CODE})" >> "$GITHUB_STEP_SUMMARY"
        working-directory: android

      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ontimeai-android-${{ inputs.tipo || 'debug' }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Autenticar contra Google Play
        if: inputs.tipo == 'release' && inputs.subir
        id: play-auth
        # Identidad federada distinta de la de deploy: play-publisher no tiene
        # ningún rol en GCP; sus permisos viven en Play Console (Usuarios y
        # permisos), y ahí se le dio solo subir a pruebas y editar la ficha.
        uses: google-github-actions/auth@v2
        with:
          project_id: ontimeai-prod
          workload_identity_provider: projects/871707213932/locations/global/workloadIdentityPools/github/providers/github
          service_account: play-publisher@ontimeai-prod.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Subir a Google Play
        if: inputs.tipo == 'release' && inputs.subir
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.play-auth.outputs.access_token }}
          PISTA: ${{ inputs.pista }}
          VERSION: ${{ inputs.version }}
          NOVEDADES: ${{ inputs.novedades }}
        run: |
          AAB=$(ls android/app/build/outputs/bundle/release/*.aab | head -1)
          node scripts/play-upload.mjs --aab "$AAB" --track "$PISTA" \
            --name "$VERSION (${{ github.run_number }})" --notes "$NOVEDADES"
          echo "Subido a la pista **$PISTA** de Google Play." >> "$GITHUB_STEP_SUMMARY"
