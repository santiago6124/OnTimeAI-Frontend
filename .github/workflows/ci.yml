name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un PR que recibe varios pushes seguidos no necesita terminar los runs viejos.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # diff-cover compara contra la rama base: necesita el historial.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Complejidad ciclomática
        # Gate: ninguna función de src/ por encima de 10 (McCabe, regla
        # `complexity` de ESLint) fuera de las exentas en
        # .complejidad-baseline.json, y esa lista sólo puede achicarse. Corre
        # con los comentarios eslint-disable apagados, así que una marca en el
        # código no exime nada; el Lint de más abajo aplica la misma regla. Va
        # antes que los tests porque tarda segundos y un fallo acá no necesita
        # la suite entera. El reporte de todas las funciones va al resumen del
        # job y como artifact. Ver COMPLEJIDAD.md.
        run: |
          node scripts/complejidad.mjs --check \
            --reporte complejidad.json \
            --resumen "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complejidad
          path: complejidad.json

      - name: Duplicación
        # Quality gate: más de 5 % de líneas duplicadas en src/ corta el
        # pipeline. Los tests quedan afuera porque repiten arrange/assert a
        # propósito. Mismos parámetros que el Backend. Ver CALIDAD.md.
        run: |
          npx --yes jscpd@4 --min-tokens 50 --min-lines 5 --threshold 5 \
            --format typescript,tsx --reporters console,json --output jscpd \
            --ignore "src/**/__tests__/**" src

      - name: Tests con cobertura
        # La cobertura mide líneas, ramas, funciones y sentencias de src/ y
        # falla por debajo del trinquete de vitest.config.mts, que sólo sube.
        # Ver CALIDAD.md.
        run: pnpm test:cov

      - name: Cobertura sobre el código nuevo
        # Quality gate: las líneas que cambia el PR tienen que estar cubiertas
        # al 80 %. Sólo en PR, porque en main no hay contra qué comparar.
        # diff-cover lee el lcov de vitest; el runner ya trae Python.
        if: github.event_name == 'pull_request'
        run: |
          pip install --quiet diff-cover==10.6.0
          diff-cover coverage/lcov.info --compare-branch="origin/${{ github.base_ref }}" \
            --fail-under=80 --markdown-report diff-cover.md

      - name: Resumen de calidad
        if: always()
        run: |
          node scripts/calidad-resumen.mjs --cobertura coverage/coverage-summary.json \
            --jscpd jscpd/jscpd-report.json --diff-cover diff-cover.md \
            --salida "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calidad
          path: |
            coverage/
            jscpd/
            diff-cover.md
          if-no-files-found: ignore

      - name: Typecheck
        # Gate de bugs críticos, primera mitad: lo que TypeScript rechaza no
        # llega a correr. El script corre `next typegen` primero: los tipos de
        # rutas de Next 16 se generan dentro de .next/, así que sobre un
        # checkout limpio tsc falla con "Cannot find name 'PageProps'" si no
        # se generan antes.
        run: pnpm typecheck

      - name: Lint
        # Gate de bugs críticos, segunda mitad: eslint-config-next ya trata
        # como error lo que rompe en runtime (hooks fuera de las reglas,
        # componentes sin `key`, props duplicadas, identificadores sin declarar
        # en JSX, setState en render); no hay reglas propias más allá de
        # `complexity`. Ver CALIDAD.md.
        run: pnpm lint

      - name: Bundle móvil (iOS)
        # El bundle de iOS se compila desde otro árbol: scripts/build-mobile.mjs
        # poda y reemplaza páginas antes de un `next build` con output:'export'.
        # Nada de lo anterior lo cubre, y así se rompió en silencio con el PR #55
        # (server-profile.ts importaba un módulo podado): tres semanas de merges
        # verdes y el primer intento de publicar un OTA fue el que lo encontró.
        # Las mismas variables que ios-ota.yml e ios-release.yml.
        env:
          MOBILE_API_ORIGIN: ${{ vars.MOBILE_API_ORIGIN }}
          MOBILE_APP_ORIGIN: ${{ vars.MOBILE_APP_ORIGIN }}
          # Para que el PR compile con la misma configuración que el release y
          # no descubramos en el build de TestFlight que falta uno de los dos.
          MOBILE_GOOGLE_IOS_CLIENT_ID: ${{ vars.MOBILE_GOOGLE_IOS_CLIENT_ID }}
          MOBILE_GOOGLE_CLIENT_ID: ${{ vars.MOBILE_GOOGLE_CLIENT_ID }}
        run: node scripts/build-mobile.mjs --strict
