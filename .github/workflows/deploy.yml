name: Deploy

# Un merge a main despliega el frontend a Cloud Run.
#
# Antes esto se corría a mano, y se notaba: el trabajo de apps móviles se mergeó
# el 06/09 y estuvo cinco días sin llegar a producción, hasta que alguien fue a
# mirar. Nada avisaba que main y producción habían divergido.
on:
  push:
    branches: [main]
  # Permite redesplegar sin tener que empujar un commit vacío.
  workflow_dispatch:

# Dos despliegues pisándose dejan Cloud Run en un estado indeterminado, así que
# el segundo espera en vez de cancelar al primero.
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

env:
  PROJECT_ID: ontimeai-prod
  REGION: us-central1

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          project_id: ontimeai-prod
          workload_identity_provider: projects/871707213932/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deployer@ontimeai-prod.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Resolver la URL del backend
        # Se lee del servicio desplegado en vez de hardcodearla: ya cambió una
        # vez con la migración de proyecto GCP, y el build la necesita como
        # substitution.
        run: |
          echo "BACKEND_URL=$(gcloud run services describe ontimeai-backend \
            --region "$REGION" --project "$PROJECT_ID" \
            --format='value(status.url)')" >> "$GITHUB_ENV"

      - name: Construir imagen
        # Se lanza en modo asincrono y se consulta el estado en vez de dejar que
        # gcloud espere: al esperar intenta leer el bucket de logs, lo que exige
        # rol Viewer sobre el proyecto. Sin ese rol sale con codigo 1 aunque el
        # build haya terminado en SUCCESS. --suppress-logs no alcanza.
        run: |
          BUILD_ID=$(gcloud builds submit \
            --config cloudbuild.yaml \
            --substitutions "_NEXT_PUBLIC_API_URL=$BACKEND_URL" \
            --async --format='value(id)' \
            --project="$PROJECT_ID" --quiet)
          echo "Build $BUILD_ID"
          while true; do
            STATUS=$(gcloud builds describe "$BUILD_ID" \
              --project="$PROJECT_ID" --format='value(status)')
            case "$STATUS" in
              SUCCESS)
                echo "Build OK"; break ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                echo "Build $STATUS"
                echo "https://console.cloud.google.com/cloud-build/builds/$BUILD_ID?project=$PROJECT_ID"
                exit 1 ;;
              *)
                sleep 15 ;;
            esac
          done

      - name: Desplegar
        run: |
          gcloud run deploy ontimeai-frontend \
            --image "gcr.io/$PROJECT_ID/ontimeai-frontend" \
            --region "$REGION" --platform managed \
            --allow-unauthenticated \
            --memory 512Mi --cpu 1 \
            --min-instances 0 --max-instances 2 \
            --set-env-vars "NEXT_PUBLIC_API_URL=$BACKEND_URL" \
            --project="$PROJECT_ID" --quiet

      - name: Resumen
        run: |
          echo "### Desplegado" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
          URL=$(gcloud run services describe ontimeai-frontend \
                  --region "$REGION" --project "$PROJECT_ID" \
                  --format='value(status.url)')
          REV=$(gcloud run services describe ontimeai-frontend \
                  --region "$REGION" --project "$PROJECT_ID" \
                  --format='value(status.latestReadyRevisionName)')
          echo "Frontend: $URL (revisión \`$REV\`)" >> "$GITHUB_STEP_SUMMARY"
