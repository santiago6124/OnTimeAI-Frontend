name: iOS Release (TestFlight)

# Compila el .ipa firmado con los assets EMPAQUETADOS y lo sube a TestFlight.
#
# A diferencia de Android, iOS no puede ser un shell remoto: App Review rechaza
# ese patrón bajo Guideline 5.6. Por eso este workflow sí corre un build web
# (scripts/build-mobile.mjs) y mete el resultado adentro del binario.
#
# Cada cambio de UI que salga por acá pasa por App Review. Para cambios que solo
# tocan JS/CSS/HTML existe ios-ota.yml, que los publica sin review — pero
# requiere una cuenta de Capgo. Si el cambio toca plugins nativos, permisos o
# cualquier cosa bajo ios/, este es el único camino.

on:
  workflow_dispatch:
    inputs:
      apiOrigin:
        description: "Origen del FastAPI (vacío = el default del script)"
        required: false
        default: ""
      appOrigin:
        description: "Origen del Next desplegado, para /api/weather"
        required: false
        default: ""
      capgo:
        description: "Activar el OTA de Capgo en este binario"
        required: true
        type: boolean
        default: false
      subir:
        description: "Subir a TestFlight (si no, solo deja el .ipa como artefacto)"
        required: true
        type: boolean
        default: false

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  build:
    name: .ipa firmado
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Dependencias
        run: pnpm install --frozen-lockfile

      - name: Bundle web empaquetado
        # --strict: sin orígenes válidos el bundle compila igual y produce una
        # app que no puede hablar con nada. Mejor fallar acá que en el teléfono.
        env:
          MOBILE_API_ORIGIN: ${{ inputs.apiOrigin || vars.MOBILE_API_ORIGIN }}
          MOBILE_APP_ORIGIN: ${{ inputs.appOrigin || vars.MOBILE_APP_ORIGIN }}
        run: node scripts/build-mobile.mjs --strict

      - name: Config de iOS (sin server.url)
        # La CLI de Capacitor lee siempre capacitor.config.ts y no acepta
        # --config. En el checkout efímero de CI se puede pisar sin consecuencias.
        run: cp capacitor.config.ios.ts capacitor.config.ts

      - name: Proyecto nativo
        env:
          MOBILE_CAPGO: ${{ inputs.capgo && '1' || '0' }}
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Verificar que NO haya server.url
        # Es la comprobación que justifica todo este workflow: un server.url en
        # el .ipa es exactamente el patrón que App Review suspende bajo 5.6.
        run: |
          URL=$(node -p "require('./ios/App/App/capacitor.config.json').server?.url ?? ''")
          if [ -n "$URL" ]; then
            echo "::error::El .ipa quedó apuntando a $URL. Un shell remoto es lo que Apple rechaza bajo Guideline 5.6."
            exit 1
          fi
          echo "OK — la app sirve sus assets desde el binario."

      - name: Verificar que los plugins no se desincronicen
        # `ios.includePlugins` es una allowlist: un plugin que esté en
        # package.json y no acá simplemente no viaja, y el JS que lo use falla
        # en el teléfono sin ningún aviso en el build.
        run: |
          # El config es TypeScript, así que se lee la allowlist con una
          # expresión regular en vez de importarlo: traer un transpilador solo
          # para esto agregaría una dependencia que nada más usa este paso.
          node - <<'JS'
          const fs = require('node:fs');

          const instalados = Object.keys(require('./package.json').dependencies)
            .filter((d) => d.startsWith('@capacitor/') || d.startsWith('@capgo/'))
            .filter((d) => !['@capacitor/cli', '@capacitor/core', '@capacitor/android', '@capacitor/ios'].includes(d))
            .sort();

          const cfg = fs.readFileSync('capacitor.config.ios.ts', 'utf8');
          const bloque = cfg.match(/includePlugins:\s*\[([\s\S]*?)\]/);
          const declarados = bloque
            ? [...bloque[1].matchAll(/["']([^"']+)["']/g)].map((m) => m[1]).sort()
            : [];

          const faltan = instalados.filter((p) => !declarados.includes(p));
          const sobran = declarados.filter((p) => !instalados.includes(p));

          console.log('package.json:', instalados.join(', ') || '(ninguno)');
          console.log('includePlugins:', declarados.join(', ') || '(ninguno)');

          if (faltan.length) {
            console.log(`::error::Estos plugins están instalados pero NO en ios.includePlugins, así que no viajan en el .ipa: ${faltan.join(', ')}. El JS que los use va a fallar en el teléfono sin que el build avise.`);
            process.exit(1);
          }
          if (sobran.length) {
            console.log(`::warning::includePlugins declara plugins que no están en package.json: ${sobran.join(', ')}`);
          }
          JS

      - name: Router de export estático
        # Sin esto la app arranca en negro: el router de Capacitor manda toda
        # ruta sin extensión al index de la raíz, y Next exporta uno por
        # directorio. Es código nativo — no se puede arreglar por OTA.
        run: bash scripts/ios-patch-router.sh

      - name: Preflight de firma
        id: firma
        env:
          CERT: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -z "$CERT" ] || [ -z "$PROFILE" ]; then
            echo "::warning::Faltan secrets de firma; se compila sin firmar (no instalable en un teléfono real)."
            echo "firmado=no" >> "$GITHUB_OUTPUT"
          else
            echo "firmado=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Importar certificado y perfil
        if: steps.firma.outputs.firmado == 'si'
        env:
          CERT: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          # Keychain efímero: el runner se destruye, pero no hay que dejar el
          # certificado en el llavero por defecto igual.
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"

          echo "$CERT" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/ontimeai.mobileprovision

          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Archive
        if: steps.firma.outputs.firmado == 'si'
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App -configuration Release \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            archive

      - name: Exportar .ipa
        if: steps.firma.outputs.firmado == 'si'
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Build sin firmar (simulador)
        # Sin secrets todavía se puede verificar que TODO lo demás compila:
        # el bundle, los plugins y el parche del router en Swift.
        if: steps.firma.outputs.firmado == 'no'
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App -sdk iphonesimulator -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build

      - name: Subir a TestFlight
        if: steps.firma.outputs.firmado == 'si' && inputs.subir
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          API_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_KEY" > ~/.appstoreconnect/private_keys/AuthKey_$API_KEY_ID.p8
          xcrun altool --upload-app -f "$RUNNER_TEMP/export/App.ipa" -t ios \
            --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"

      - name: Publicar artefactos
        if: always() && steps.firma.outputs.firmado == 'si'
        uses: actions/upload-artifact@v4
        with:
          name: ontimeai-ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: warn
          retention-days: 30
