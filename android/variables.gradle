ext {
    minSdkVersion = 23
    // 36 y no 35: Google Play exige targetSdk 36 (Android 16) para apps nuevas
    // y actualizaciones desde el 31/08/2026. Capacitor 7 documenta 35 como su
    // versión soportada; la app en Android es un WebView remoto sin código
    // nativo propio, así que el salto no toca nada que dependa del SDK. La
    // migración a Capacitor 8 (que trae 36 de fábrica) queda pendiente porque
    // exige Xcode 26 en CI y rehacer la parte de iOS.
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.9.2'
    androidxAppCompatVersion = '1.7.0'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.15.0'
    androidxFragmentVersion = '1.8.4'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.12.1'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.2.1'
    androidxEspressoCoreVersion = '3.6.1'
    cordovaAndroidVersion = '10.1.1'
}